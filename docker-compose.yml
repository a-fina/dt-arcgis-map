version: '3.9'

services:
  arcgis-map:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dt-arcgis-map
    ports:
      - "8080:8080"
    environment:
      - CATALINA_OPTS=-Xmx512m -Xms256m
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/opt/tomcat/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
